language: it-IT
key: home.about.description
value: "Città.Paese.Clima! Alto Adige è un progetto di Climate Action South Tyrol, insieme al Dachverband für Natur- und Umweltschutz in Südtirol e all'Ökoinstitut Südtirol. Con valutazioni trasparenti e lo scambio di buone pratiche sosteniamo i comuni dell'Alto Adige nel loro percorso verso la neutralità climatica."
