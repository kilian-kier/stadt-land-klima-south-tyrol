language: de-DE
key: home.about.description
value: "Stadt.Land.Klima! Südtirol ist ein Projekt von Climate Action South Tyrol, gemeinsam mit dem Dachverband für Natur- und Umweltschutz in Südtirol und dem Ökoinstitut Südtirol. Mit nachvollziehbaren Bewertungen und dem Austausch guter Praxis unterstützen wir die Südtiroler Gemeinden auf dem Weg zur Klimaneutralität."
