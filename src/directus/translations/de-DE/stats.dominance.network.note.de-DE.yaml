language: de-DE
key: stats.dominance.network.note
value: <strong>Nähe</strong> = Gemeinden sind durch eine Dominanzkante direkt
  verbunden und werden zusammengezogen (Federkraft). <strong>Distanz</strong> =
  keine direkte Kante - Abstoßung dominiert. Cluster aus eng beieinander
  liegenden Knoten sind Leistungs-Tiers, in denen sich Gemeinden gegenseitig
  ähnlich stark übertreffen oder auf Augenhöhe sind.
