language: de-DE
key: municipalities.overall_status_comment
value: >-
  Hier kannst du generelle Anmerkungen zum aktuellen Stand deiner Gemeinde
  machen, die wichtig zur Interpretation des Rankings sind.


  Zum Beispiel könntest du hier über geplante Projekte der Gemeinde informieren,
  die das Ranking in Zukunft deutlich verbessern könnten.
