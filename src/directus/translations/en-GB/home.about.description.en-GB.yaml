language: en-GB
key: home.about.description
value: "Stadt.Land.Klima! South Tyrol is a project of Climate Action South Tyrol, together with the Dachverband für Natur- und Umweltschutz in Südtirol and the Ökoinstitut Südtirol. With transparent assessments and the exchange of good practice, we support South Tyrol's municipalities on their way to climate neutrality."
